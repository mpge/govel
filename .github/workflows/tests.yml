name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.3', '8.4']
        laravel: ['11.*', '12.*']

    name: PHP ${{ matrix.php }} — Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" --no-update
          composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test fixtures
        run: chmod +x tests/fixtures/*

      - name: Run tests
        run: vendor/bin/phpunit

  go-build:
    runs-on: ubuntu-latest
    name: Go Build & Vet

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Vet, test, and build govel-server
        run: |
          cd bin/workers/govel-server
          go vet ./...
          go test ./...
          go build -o /dev/null .

      - name: Vet and build process-image
        run: |
          cd bin/workers/process-image
          go vet ./...
          go build -o /dev/null .

      - name: Vet and test govel-sdk
        run: |
          cd bin/workers/govel-sdk
          go vet ./...
          go test ./...
